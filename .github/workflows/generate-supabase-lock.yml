name: Generate Supabase lockfile

on:
  push:
    branches:
      - feat/saas-shell-auth
    paths:
      - .github/workflows/generate-supabase-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: feat/saas-shell-auth

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Supabase dependency lock state
        run: pnpm add @supabase/supabase-js @supabase/ssr

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "build: lock Supabase SSR dependencies"
          git push origin HEAD:feat/saas-shell-auth
