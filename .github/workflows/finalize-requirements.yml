name: Finalize verified requirements source

on:
  push:
    branches:
      - feat/product-foundation-requirements
    paths:
      - .requirements-staging/**
      - .github/workflows/finalize-requirements.yml

permissions:
  contents: write

concurrency:
  group: finalize-requirements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/product-foundation-requirements
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .requirements-staging/part-00.b64 \
              .requirements-staging/part-01.b64 \
              .requirements-staging/part-02.b64 \
              .requirements-staging/part-03.b64 \
            | tr -d '\n\r' \
            | base64 --decode > /tmp/requirements-source.tar.xz

          actual_sha="$(sha256sum /tmp/requirements-source.tar.xz | awk '{print $1}')"
          expected_sha="1d4f498e5a662b670752bf7e72816b87e128cf1171b72dc23940705d5cd8da7e"
          test "$actual_sha" = "$expected_sha"
          test "$(stat -c%s /tmp/requirements-source.tar.xz)" = "43668"

          rm -rf /tmp/requirements-source
          mkdir -p /tmp/requirements-source
          tar -xJf /tmp/requirements-source.tar.xz -C /tmp/requirements-source

      - name: Verify every source file against manifest
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/requirements-source')
          manifest = json.loads(Path('.requirements-staging/source-manifest.json').read_text(encoding='utf-8'))
          expected = {item['path']: item for item in manifest['files']}
          actual_paths = sorted(str(path.relative_to(root)) for path in root.rglob('*') if path.is_file())

          if actual_paths != sorted(expected):
              missing = sorted(set(expected) - set(actual_paths))
              extra = sorted(set(actual_paths) - set(expected))
              raise SystemExit(f'source file set mismatch: missing={missing} extra={extra}')

          for relative, item in expected.items():
              path = root / relative
              data = path.read_bytes()
              if len(data) != item['size']:
                  raise SystemExit(f'size mismatch for {relative}: {len(data)} != {item["size"]}')
              digest = hashlib.sha256(data).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f'sha256 mismatch for {relative}: {digest} != {item["sha256"]}')

          print(f'PASS: verified {len(expected)} source files byte-for-byte')

      - name: Persist source and operational requirements
        shell: bash
        run: |
          set -euo pipefail
          source_root=/tmp/requirements-source
          durable_root=docs/requirements/source/AI-Interviewer-Codex-Pack

          rm -rf "$durable_root"
          mkdir -p "$durable_root"
          cp -a "$source_root/." "$durable_root/"
          cp .requirements-staging/source-manifest.json docs/requirements/SOURCE-MANIFEST.json

          rm -rf docs/product docs/iterations
          cp -a "$source_root/docs/product" docs/product
          cp -a "$source_root/docs/iterations" docs/iterations
          mkdir -p scripts
          cp "$source_root/scripts/verify_prd_coverage.py" scripts/verify_prd_coverage.py

          python3 scripts/verify_prd_coverage.py
          python3 scripts/verify_autonomous_framework.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lock dependency graph and enforce frozen CI installs
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          sed -i 's/pnpm install --no-frozen-lockfile/pnpm install --frozen-lockfile/' .github/workflows/ci.yml
          grep -F 'pnpm install --frozen-lockfile' .github/workflows/ci.yml
          python3 scripts/verify_prd_coverage.py
          python3 scripts/verify_autonomous_framework.py

      - name: Remove one-time transport and commit verified state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .requirements-staging
          rm -f .github/workflows/finalize-requirements.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: persist verified requirements source and lock dependencies'
          git push origin HEAD:feat/product-foundation-requirements
