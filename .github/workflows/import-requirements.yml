name: Import requirements pack

on:
  push:
    branches:
      - feat/product-foundation-requirements

permissions:
  contents: write

concurrency:
  group: import-requirements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/product-foundation-requirements
          fetch-depth: 0

      - name: Decode and verify requirements archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          expected = "900353885ef4911b9ebb7a656f9e0771227df008db773919a632aedefa4596ba"
          data = Path(".bootstrap/AI-Interviewer-Codex-Pack.zip").read_bytes()

          for depth in range(4):
              digest = hashlib.sha256(data).hexdigest()
              print(f"decode_depth={depth} bytes={len(data)} sha256={digest}")
              if digest == expected:
                  Path("/tmp/requirements-pack.zip").write_bytes(data)
                  print(f"verified archive at decode depth {depth}")
                  break
              try:
                  data = base64.b64decode(data, validate=True)
              except Exception as exc:
                  raise SystemExit(f"verified archive not found before base64 decoding stopped: {exc}")
          else:
              raise SystemExit("verified archive not found within three base64 decode layers")
          PY

      - name: Import missing source-of-truth files
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          unzip -q /tmp/requirements-pack.zip -d "$workdir"

          python3 - "$workdir/AI-Interviewer-Codex-Pack" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          source = Path(sys.argv[1])
          destination = Path('.')
          live_overrides = {
              Path('README.md'),
              Path('docs/milestones/CURRENT.md'),
          }

          copied = []
          for src in sorted(p for p in source.rglob('*') if p.is_file()):
              rel = src.relative_to(source)
              dst = destination / rel

              if dst.exists():
                  if rel not in live_overrides and dst.read_bytes() != src.read_bytes():
                      raise SystemExit(f"Existing file diverges from requirements pack: {rel}")
                  continue

              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied.append(str(rel))

          packaging_readme = destination / 'docs/requirements-pack/README.md'
          packaging_readme.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source / 'README.md', packaging_readme)

          print(f"Imported {len(copied)} missing files")
          for path in copied:
              print(path)
          PY

          python3 scripts/verify_prd_coverage.py
          rm -rf .bootstrap .tmp

      - name: Commit imported requirements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No requirements files needed importing"
            exit 0
          fi
          git commit -m "docs: import complete requirements pack"
          git push origin HEAD:feat/product-foundation-requirements
