name: Import requirements pack

on:
  push:
    branches:
      - feat/product-foundation-requirements

permissions:
  contents: write

concurrency:
  group: import-requirements-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Diagnose archive encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          expected = "900353885ef4911b9ebb7a656f9e0771227df008db773919a632aedefa4596ba"
          data = Path(".tmp/requirements-pack.zip").read_bytes()

          for depth in range(4):
              digest = hashlib.sha256(data).hexdigest()
              print(f"depth={depth} bytes={len(data)} sha256={digest} prefix={data[:16]!r}")
              if digest == expected:
                  Path("/tmp/requirements-pack.zip").write_bytes(data)
                  print(f"matched expected archive at depth={depth}")
                  break
              try:
                  data = base64.b64decode(data, validate=True)
              except Exception as exc:
                  raise SystemExit(f"no valid archive found before base64 decoding stopped: {exc}")
          else:
              raise SystemExit("no valid archive found within three base64 decode layers")
          PY
      - name: Extract missing requirements
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          unzip -q /tmp/requirements-pack.zip -d "$workdir"
          src="$workdir/AI-Interviewer-Codex-Pack"
          test -d "$src"

          # Preserve the repository's existing product README and execution-state files.
          # Import every source-of-truth file that is still missing from the repository.
          rsync -a --ignore-existing --exclude 'README.md' "$src/" ./

          # Keep the original packaging README available without replacing the product README.
          mkdir -p docs/requirements-pack
          cp "$src/README.md" docs/requirements-pack/README.md

          python3 scripts/verify_prd_coverage.py

          rm -f .tmp/requirements-pack.zip
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/import-requirements.yml
      - name: Commit imported requirements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs: import complete requirements pack"
          git push origin HEAD:feat/product-foundation-requirements
