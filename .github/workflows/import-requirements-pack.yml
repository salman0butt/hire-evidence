name: Import requirements pack

on:
  push:
    branches:
      - feat/product-foundation-requirements

permissions:
  contents: write

concurrency:
  group: import-requirements-pack
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/product-foundation-requirements
          fetch-depth: 0

      - name: Verify archive and import missing files
        shell: bash
        run: |
          set -euo pipefail
          expected="900353885ef4911b9ebb7a656f9e0771227df008db773919a632aedefa4596ba"
          actual="$(sha256sum .bootstrap/AI-Interviewer-Codex-Pack.zip | awk '{print $1}')"
          test "$actual" = "$expected"

          rm -rf /tmp/hire-evidence-requirements
          mkdir -p /tmp/hire-evidence-requirements
          unzip -q .bootstrap/AI-Interviewer-Codex-Pack.zip -d /tmp/hire-evidence-requirements

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source = Path('/tmp/hire-evidence-requirements/AI-Interviewer-Codex-Pack')
          destination = Path('.')
          allowed_live_overrides = {
              Path('README.md'),
              Path('docs/milestones/CURRENT.md'),
          }

          copied = []
          for src in sorted(p for p in source.rglob('*') if p.is_file()):
              rel = src.relative_to(source)
              dst = destination / rel
              if dst.exists():
                  if rel not in allowed_live_overrides and dst.read_bytes() != src.read_bytes():
                      raise SystemExit(f'Existing file diverges from requirements pack: {rel}')
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied.append(str(rel))

          print(f'Imported {len(copied)} missing files')
          for path in copied:
              print(path)
          PY

          python3 scripts/verify_prd_coverage.py

      - name: Commit imported requirements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md CODEX-START-HERE.md FILE-INVENTORY.md docs prompts scripts templates .github/PULL_REQUEST_TEMPLATE.md
          if git diff --cached --quiet; then
            echo "No requirements files needed importing"
            exit 0
          fi
          git commit -m "docs: import complete requirements pack"
          git push origin HEAD:feat/product-foundation-requirements
