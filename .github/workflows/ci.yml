name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Framework verifier tests
        run: python3 -m unittest tests/python/test_verify_autonomous_framework.py
      - name: Requirements source verifier tests
        run: python3 -m unittest tests/python/test_verify_requirements_source.py
      - name: Verify autonomous framework
        run: python3 scripts/verify_autonomous_framework.py
      - name: Verify requirements source integrity
        run: python3 scripts/verify_requirements_source.py
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke E2E
        env:
          CI: "true"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: pnpm e2e
      - name: Verify PRD coverage
        run: python3 scripts/verify_prd_coverage.py
