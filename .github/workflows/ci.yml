name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Framework verifier tests
        run: python3 -m unittest tests/python/test_verify_autonomous_framework.py
      - name: Requirements source verifier tests
        run: python3 -m unittest tests/python/test_verify_requirements_source.py
      - name: Verify autonomous framework
        run: python3 scripts/verify_autonomous_framework.py
      - name: Verify requirements source integrity
        run: python3 scripts/verify_requirements_source.py
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: |
          supabase start
          supabase db reset
      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)"
          test -n "$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_MAILPIT_URL=http://127.0.0.1:54324" >> "$GITHUB_ENV"
      - name: Build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        env:
          CI: "true"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          pnpm e2e 2>&1 | tee e2e-output.log
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: |
            e2e-output.log
            test-results/
          if-no-files-found: warn
          retention-days: 3
      - name: Verify PRD coverage
        run: python3 scripts/verify_prd_coverage.py
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup